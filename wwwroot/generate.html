<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Motion</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Courier New', monospace;
    background-color: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #layout {
    display: flex;
    width: 100%;
    height: 100%;
  }

  #sidebar {
    width: 300px;
    background-color: #16213e;
    border-right: 1px solid #0f3460;
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 12px;
    overflow-y: auto;
  }

  #sidebar h2 {
    color: #e94560;
    margin-bottom: 5px;
    font-size: 1.1em;
  }

  #nav-link {
    color: #888;
    text-decoration: none;
    font-size: 0.9em;
    margin-bottom: 10px;
  }

  #nav-link:hover {
    color: #e94560;
  }

  .form-label {
    font-size: 0.85em;
    color: #888;
    margin-top: 10px;
    margin-bottom: 4px;
    display: block;
  }

  #model-select, #text-input {
    width: 100%;
    padding: 10px;
    background-color: #0f3460;
    border: 1px solid #0f3460;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    border-radius: 2px;
    font-size: 0.9em;
  }

  #model-select:focus, #text-input:focus {
    outline: none;
    border-color: #e94560;
    box-shadow: 0 0 5px rgba(233, 69, 96, 0.3);
  }

  #text-input::placeholder {
    color: #666;
  }

  #text-input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #generate-btn {
    width: 100%;
    padding: 10px;
    background-color: #0f3460;
    border: 1px solid #e94560;
    color: #e94560;
    font-family: 'Courier New', monospace;
    font-size: 0.95em;
    border-radius: 2px;
    cursor: pointer;
    margin-top: 5px;
  }

  #generate-btn:hover:not(:disabled) {
    background-color: #e94560;
    color: #1a1a2e;
  }

  #generate-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #status {
    font-size: 0.8em;
    color: #888;
    margin-top: 5px;
    min-height: 16px;
  }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  #caption-bar {
    padding: 15px;
    background-color: #16213e;
    border-bottom: 1px solid #0f3460;
    font-size: 0.95em;
    min-height: 50px;
    display: flex;
    align-items: center;
    color: #ccc;
  }

  #viewport {
    flex: 1;
    position: relative;
  }

  #canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  #no-selection {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #444;
    font-size: 16px;
  }

  #controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 15px;
    background-color: #16213e;
    border-top: 1px solid #0f3460;
  }

  #controls button {
    background-color: #0f3460;
    border: 1px solid #e94560;
    color: #e94560;
    padding: 8px 16px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 0.9em;
    border-radius: 2px;
    min-width: 70px;
  }

  #controls button:hover:not(:disabled) {
    background-color: #e94560;
    color: #1a1a2e;
  }

  #controls button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #timeline {
    flex: 1;
    cursor: pointer;
    accent-color: #e94560;
  }

  #timeline:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #frame-info {
    font-size: 0.85em;
    color: #888;
    min-width: 80px;
    text-align: right;
  }
</style>
</head>
<body>

<div id="layout">
  <div id="sidebar">
    <h2>Text to Motion</h2>
    <a id="nav-link" href="/homepage">← Back</a>

    <label class="form-label">Model</label>
    <select id="model-select"></select>

    <label class="form-label">Prompt</label>
    <input id="text-input" type="text" placeholder="a person walks forward…" autocomplete="off">

    <button id="generate-btn">Generate</button>
    <span id="status"></span>
  </div>

  <div id="main">
    <div id="caption-bar">Enter a text prompt and click Generate.</div>
    <div id="viewport">
      <canvas id="canvas"></canvas>
      <div id="no-selection">Waiting for generation…</div>
    </div>
    <div id="controls">
      <button id="play-btn" disabled>Play</button>
      <input id="timeline" type="range" min="0" max="0" value="0" disabled>
      <span id="frame-info">0 / 0</span>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module" src="generate.js"></script>
</body>
</html>
